name: Update Schedule via Home Keenetic

on:
  schedule:
    # Запуск каждые 3 часа
    - cron: '0 */3 * * *'
  workflow_dispatch: # Кнопка ручного запуска

permissions: write-all

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Клонирование репозитория
        uses: actions/checkout@v4

      - name: 🐍 Установка Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Установка библиотек
        run: |
          pip install requests beautifulsoup4

      - name: 🛡️ Точечное подключение к Keenetic (только для sut.ru)
        run: |
          sudo apt-get update
          sudo apt-get install -y wireguard dnsutils

          # 1. Убираем строку DNS, чтобы не вешать сеть виртуальной машины
          # 2. Меняем 0.0.0.0/0 на подсети Бонча (87.249.0.0/16), чтобы через роутер шёл ТОЛЬКО трафик университета!
          echo "${{ secrets.WG_CONFIG }}" \
            | grep -v "DNS" \
            | sed 's|AllowedIPs = 0.0.0.0/0|AllowedIPs = 87.249.0.0/16, 92.255.0.0/16|g' \
            | sudo tee /etc/wireguard/wg0.conf

          sudo chmod 600 /etc/wireguard/wg0.conf

          # Запуск интерфейса
          sudo wg-quick up wg0

          echo "✅ WireGuard успешно поднят! Проверяем доступ к сайту Бонча..."
          curl -I --max-time 10 https://www.sut.ru || echo "Ошибка подключения к сайту"

      - name: 🚀 Запуск парсера
        run: |
          python run_scraper.py

      - name: 🔌 Отключение VPN
        if: always()
        run: |
          sudo wg-quick down wg0 || true

      - name: 💾 Публикация базы в Releases
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: Актуальная база расписания СПбГУТ
          files: schedule.db
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
