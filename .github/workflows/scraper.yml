name: University Schedule Scraper

on:
  schedule:
    # 1. Быстрый парс каждые 2 часа (в 0 минут каждого четного часа)
    - cron: '0 */2 * * *'
    # 2. Полный парс в 20:00 по МСК (17:00 UTC)
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Тип парсинга (fast или full)'
        required: true
        default: 'fast'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: VPN Connect (WireGuard)
        run: |
          sudo apt-get update && sudo apt-get install -y wireguard
          echo "${{ secrets.WG_CONFIG }}" | grep -v "DNS" | sed '/\[Interface\]/a Table = off' | sudo tee /etc/wireguard/wg0.conf
          sudo wg-quick up wg0
          for domain in sut.ru www.sut.ru; do
            for ip in $(getent ahosts $domain | awk '{print $1}' | grep -E '^[0-9.]+$' | sort -u); do
              sudo ip route add $ip dev wg0 || true
            done
          done

      - name: Run Scraper
        run: |
          # Если запуск в 17:00 UTC (20:00 MSK) — запускаем полный режим
          if [[ "${{ github.event.schedule }}" == "0 17 * * *" || "${{ github.event.inputs.mode }}" == "full" ]]; then
            python -u run_scraper.py --full
          else
            python -u run_scraper.py
          fi

      - name: VPN Disconnect
        if: always()
        run: sudo wg-quick down wg0 || true

      - name: Upload Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "schedule.db"
          tag: "latest"
          name: "Актуальная база расписания СПбГУТ"
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
