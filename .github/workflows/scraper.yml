name: Update Schedule via Home Keenetic

on:
  schedule:
    # Запуск каждые 3 часа
    - cron: '0 */3 * * *'
  workflow_dispatch: # Кнопка ручного запуска

permissions: write-all

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Клонирование репозитория
        uses: actions/checkout@v4

      - name: 🐍 Установка Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Установка библиотек
        run: |
          pip install requests beautifulsoup4

      - name: 🛡️ Подключение WireGuard к домашнему Keenetic
        run: |
          sudo apt-get update
          sudo apt-get install -y wireguard resolvconf
          echo "${{ secrets.WG_CONFIG }}" | sudo tee /etc/wireguard/wg0.conf
          sudo chmod 600 /etc/wireguard/wg0.conf
          sudo wg-quick up wg0
          echo "=== Проверка внешнего IP (должен быть твой домашний) ==="
          curl -s https://ifconfig.me
          echo ""

      - name: 🚀 Запуск парсера
        run: |
          python run_scraper.py

      - name: 🔌 Отключение VPN
        if: always()
        run: |
          sudo wg-quick down wg0 || true

      - name: 💾 Публикация базы в Releases
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: Актуальная база расписания СПбГУТ
          files: schedule.db
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
