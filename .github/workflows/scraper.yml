name: Database Sync Task

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Sync mode (fast / full)'
        required: true
        default: 'fast'

concurrency:
  group: sync-database
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    
    timeout-minutes: 120
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch previous DB state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download latest -p "schedule.db" || echo "No previous DB found, initializing new one"

      - name: Establish secure tunnel
        run: |
          sudo apt-get update && sudo apt-get install -y wireguard
          echo "${{ secrets.WG_CONFIG }}" | grep -v "DNS" | sed '/\[Interface\]/a Table = off' | sudo tee /etc/wireguard/wg0.conf
          sudo wg-quick up wg0
          for domain in sut.ru www.sut.ru; do
            for ip in $(getent ahosts $domain | awk '{print $1}' | grep -E '^[0-9.]+$' | sort -u); do
              sudo ip route add $ip dev wg0 || true
            done
          done

      - name: Run synchronization script
        run: |
          # Проверяем, совпадает ли расписание или ручной ввод
          if [[ "${{ github.event.schedule }}" == "15 17 * * *" || "${{ github.event.inputs.mode }}" == "full" ]]; then
            echo "Running FULL sync mode..."
            python -u run_scraper.py --full
          else
            echo "Running FAST sync mode..."
            python -u run_scraper.py
          fi

      - name: Close tunnel
        if: always()
        run: sudo wg-quick down wg0 || true

      - name: Upload new DB
        uses: ncipollo/release-action@v1
        with:
          artifacts: "schedule.db"
          tag: "latest"
          name: "Database Update"
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
