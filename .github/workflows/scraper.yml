name: Update Schedule via Home Keenetic

on:
  schedule:
    # Запуск каждые 3 часа
    - cron: '0 */2 * * *'
  workflow_dispatch: # Кнопка ручного запуска

permissions: write-all

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Клонирование репозитория
        uses: actions/checkout@v4

      - name: 🐍 Установка Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Установка библиотек
        run: |
          pip install requests beautifulsoup4

      - name: 🛡️ Точечный маршрут к сайту Бонча через Keenetic
        run: |
          sudo apt-get update
          sudo apt-get install -y wireguard

          # 1. Формируем конфиг WireGuard с выключенным авто-маршрутом (Table = off),
          # чтобы тоннель не трогал сеть самого Гитхаба
          echo "${{ secrets.WG_CONFIG }}" \
            | grep -v "DNS" \
            | sed '/\[Interface\]/a Table = off' \
            | sudo tee /etc/wireguard/wg0.conf

          sudo chmod 600 /etc/wireguard/wg0.conf

          # 2. Поднимаем тоннель к Keenetic
          sudo wg-quick up wg0

          # 3. Вычисляем ТОЧНЫЕ IP-адреса сайта Бонча и направляем их в wg0
          echo "🔍 Определение IP-адресов сайта Бонча..."
          for domain in sut.ru www.sut.ru; do
            for ip in $(getent ahosts $domain | awk '{print $1}' | grep -E '^[0-9.]+$' | sort -u); do
              echo "➡️ Направляем $domain ($ip) через домашний роутер Keenetic (wg0)..."
              sudo ip route add $ip dev wg0 || true
            done
          done

          echo "✅ Маршрутизация настроена! Проверяем реальный ответ сайта Бонча..."
          curl -I -A "Mozilla/5.0" --max-time 15 https://www.sut.ru

      - name: 🚀 Запуск парсера
        run: |
          python -u run_scraper.py

      - name: 🔌 Отключение VPN
        if: always()
        run: |
          sudo wg-quick down wg0 || true

      - name: 💾 Публикация базы в Releases
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: Актуальная база расписания СПбГУТ
          files: schedule.db
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
